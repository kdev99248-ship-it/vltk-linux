# One-command JX1 offline stack (MySQL-only).
#
#   docker compose up -d --build
#
# Services:
#   mysql57      account_tong (account/relay) + server1 (game) on one engine
#   paysys       sword3paysys_cpp  (account/billing, port 5002) -> MySQL
#   s3relay_ref  s3relayserver_cpp (relay,           port 5003) -> MySQL
#   gateway      goddess/bishop/s3relay_y/jx_linux_y (needs gateway-6.0/ + server1/)
services:
  mysql57:
    image: mysql:5.7
    container_name: jx1_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234560123"
      MYSQL_ROOT_HOST: "%"
      TZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./dockerdata/mysql_server1/data:/var/lib/mysql
      # Loaded once, on first init of an empty data dir, in filename order.
      - ./dbbackup/account_tong.sql:/docker-entrypoint-initdb.d/00-account_tong.sql:ro
      - ./dbbackup/server1.sql:/docker-entrypoint-initdb.d/10-server1.sql:ro
    ports:
      # Backend: bind to loopback so MySQL (weak root password) is NEVER
      # reachable from the internet on a public VPS. Other containers still
      # reach it over the Compose network as mysql57:3306.
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p1234560123 --silent"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 20s

  s3relay_ref:
    build:
      context: .
      dockerfile: docker/s3relay-reference/Dockerfile
    platform: linux/amd64
    container_name: jx_s3relay_cpp
    environment:
      CAPTURE_DIR: "/captures"
      MYSQL_TARGET: "mysql57:3306"
    volumes:
      - ./:/work:ro
      - ./captures:/captures
    ports:
      # Backend: loopback only. The gateway reaches the relay over gateway_lan
      # (10.211.55.4:5003); nothing outside the host needs this port.
      - "127.0.0.1:5003:5003"
    networks:
      default: {}
      gateway_lan:
        ipv4_address: 10.211.55.4
    depends_on:
      mysql57:
        condition: service_healthy
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5003' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  paysys:
    build:
      context: .
      dockerfile: docker/paysys-reference/Dockerfile
    platform: linux/amd64
    container_name: jx_paysys_cpp
    environment:
      CAPTURE_DIR: "/captures"
      MYSQL_TARGET: "mysql57:3306"
    volumes:
      - ./:/work:ro
      - ./captures:/captures
    ports:
      # Backend: loopback only. Bishop reaches PaySys through the gateway's
      # internal socat forward; no external client talks to :5002 directly.
      - "127.0.0.1:5002:5002"
    depends_on:
      mysql57:
        condition: service_healthy
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/5002' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ./docker/gateway
      dockerfile: Dockerfile
    platform: linux/386
    container_name: jx_gateway
    working_dir: /home/jxser/gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAY_SYS_TARGET: "paysys:5002"
      # Fixed gateway_lan address so C++ Relay's native peer-IP verification
      # sees the same 10.211.55.2 identity seeded in ServerList.cIP.
      S3RELAY_TARGET: "${S3RELAY_TARGET:-10.211.55.4:5003}"
      MYSQL_TARGET: "mysql57:3306"
      PATCH_ELF_BSS: "0"
      RUN_GODDESS: "1"
      RUN_BISHOP: "1"
      RUN_S3RELAY: "1"
      RUN_GAME: "1"
      # NOTE: this is the INTERNAL gateway_lan bind address, NOT the VPS public
      # IP. Do not change it. The address advertised to remote clients lives in
      # the game .cfg/.ini files and is set by deploy/vps-deploy.sh (PUBLIC_IP).
      GAME_PUBLIC_IP: "10.211.55.2"
      GAME_PORT: "6666"
      CAPTURE_DIR: "/captures"
      # Debug-only kickout tracers: when "1" the matching binary runs under
      # `gdb -batch` (see docker/gateway/trace-*.gdb). Keep these "0" for normal
      # play — gdb stops on signals a game server ignores (e.g. SIGPIPE) and, in
      # batch mode, kills the process, which crash-loops the gateway. Enable one
      # only while actively tracing that binary's kickout path.
      TRACE_GODDESS_KICK: "0"
      TRACE_BISHOP_KICK: "0"
      TRACE_GAME_KICK: "0"
    depends_on:
      mysql57:
        condition: service_healthy
      s3relay_ref:
        condition: service_healthy
      paysys:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - ./gateway-6.0:/home/jxser/gateway
      - ./server1:/home/jxser/server1
      - ./captures:/captures
    ports:
      # Backend (loopback only): goddess RoleServer is reached by bishop over
      # 127.0.0.1 inside the container; clients never connect to it.
      - "127.0.0.1:5001:5001"
      # Client-facing ports (published to the internet on a VPS):
      - "5622:5622"   # bishop ClientOpenPort — client login
      - "5623:5623"   # bishop DenialPort
      - "5632:5632"   # bishop GameSvrOpenPort
      - "6666:6666"   # jx_linux_y game data
    networks:
      default: {}
      gateway_lan:
        ipv4_address: 10.211.55.2
    restart: unless-stopped

networks:
  gateway_lan:
    ipam:
      config:
        - subnet: 10.211.55.0/24
